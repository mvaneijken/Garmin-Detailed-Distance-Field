name: Release

# Step 1 of 2 of a release (step 2 is publish-release.yml).
#
# A maintainer runs this workflow on master with the new SemVer version. It
#   - checks the version (x.y.z, higher than every existing release tag, tag not taken),
#   - builds and validates exactly like PR Validation, but signed with the store signing key,
#   - pushes the tag and creates a DRAFT GitHub release with generated release notes, the signed
#     .iq and its SHA-256.
#
# A draft is only visible to users with write access and sends no notifications. Edit the release
# notes on the Releases page, then run "Publish Release" (publish-release.yml), which waits for the
# approval on the "release" environment before it makes the release public.

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (SemVer x.y.z, e.g. 2.4.0). Becomes the tag name.'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Releases are cut from master only; the signing key secret is only read in this job.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      APP_NAME: Garmin-Detailed-Distance-Field
    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (x.y.z)."
            exit 1
          fi
          retry='false'
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            # Allow a re-run after a failed draft creation: same commit, and no release for the tag yet.
            tag_commit="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            has_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$VERSION\")] | length" | awk '{s+=$1} END {print s+0}')"
            if [ "$tag_commit" = "$GITHUB_SHA" ] && [ "$has_release" -eq 0 ]; then
              echo "::notice::Tag '$VERSION' already points at this commit and has no release; resuming."
              retry='true'
            else
              echo "::error::Tag '$VERSION' already exists (commit $tag_commit, releases: $has_release)."
              exit 1
            fi
          fi
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
          # Existing tags follow the bare-number style (2.2.4 ... 2.3.1, and 2.3).
          previous="$(git tag -l | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -vxF "$VERSION" | sort -V | tail -n 1 || true)"
          if [ -n "$previous" ]; then
            highest="$(printf '%s\n%s\n' "$previous" "$VERSION" | sort -V | tail -n 1)"
            if [ "$highest" != "$VERSION" ]; then
              echo "::error::'$VERSION' is not higher than the latest release tag '$previous'."
              exit 1
            fi
          fi
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (previous tag: ${previous:-<none>})."

      - name: Check action pins
        run: bash tools/ci/check-action-pins.sh .

      - name: Log in to ghcr.io (read the private toolchain image)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Write signing key
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CIQ_DEVELOPER_KEY" ]; then
            echo "::error::Secret CIQ_DEVELOPER_KEY (base64 of the store developer_key.der) is not set. See docs/CI-CD.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          chmod 700 "$RUNNER_TEMP/keys"
          printf '%s' "$CIQ_DEVELOPER_KEY" | base64 --decode > "$RUNNER_TEMP/keys/developer_key.der"
          # Readable for the container user (same uid as the runner); the directory stays 700.
          chmod 600 "$RUNNER_TEMP/keys/developer_key.der"

      - name: Build (release, signed)
        run: |
          bash tools/ci/ciq-run.sh --mount "$RUNNER_TEMP/keys:/keys" -- \
            bash tools/ci/build.sh --source . --out dist --key /keys/developer_key.der --release --version "$VERSION"

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Unit tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/testkeys"
          openssl genrsa -out "$RUNNER_TEMP/t.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -in "$RUNNER_TEMP/t.pem" -out "$RUNNER_TEMP/testkeys/developer_key.der"
          chmod a+r "$RUNNER_TEMP/testkeys/developer_key.der"
          bash tools/ci/ciq-run.sh --mount "$RUNNER_TEMP/testkeys:/keys" -- \
            bash tools/ci/run-unit-tests.sh --source . --out dist/tests --key /keys/developer_key.der --device fenix847mm

      - name: Job summary
        if: always()
        run: |
          if [ -f .ci-summary.md ]; then cat .ci-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          docker logout ghcr.io || true

      - name: Create tag
        if: steps.version.outputs.retry != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release (draft)
        id: gh_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ env.APP_NAME }} v${{ inputs.version }}
          files: |
            dist/${{ env.APP_NAME }}-${{ inputs.version }}.iq
            dist/${{ env.APP_NAME }}-${{ inputs.version }}.iq.sha256
          draft: true
          generate_release_notes: true
          previous_tag: ${{ steps.version.outputs.previous_tag }}
          fail_on_unmatched_files: true

      - name: Report draft release
        env:
          RELEASE_URL: ${{ steps.gh_release.outputs.url }}
        run: |
          {
            echo "## Draft release $VERSION created"
            echo ""
            echo "1. Review and edit the release notes: $RELEASE_URL"
            echo "2. Run **Publish Release** with tag \`$VERSION\` and approve the \`release\` environment."
          } >> "$GITHUB_STEP_SUMMARY"
