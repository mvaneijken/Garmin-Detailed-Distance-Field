name: Dependency Review

# Gates the dependency graph diff of every pull request (here: the GitHub Actions the workflows use).
# Its own workflow because pr-validation.yml is issue_comment-driven, while the dependency review
# needs a real pull_request event. It reads the Dependency Review API and executes nothing from the
# pull request branch. Requires the dependency graph, which is available for public repositories.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # The job name is the check name required by .github/rulesets/protect-master.json.
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          allow-licenses: MIT, Apache-2.0

