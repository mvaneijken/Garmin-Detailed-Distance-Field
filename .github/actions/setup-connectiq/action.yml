name: Set up Connect IQ SDK
description: >-
  Installs the Connect IQ SDK and the device files for every product in manifest.xml, using the
  community connect-iq-sdk-manager CLI (Apache-2.0). The SDK and device files are cached; the Garmin
  login only happens on a cache miss, and the login token is deleted before this action returns, so
  no later step (and no code from the pull request) can read it.

inputs:
  manifest:
    description: Path to manifest.xml that lists the products to download devices for.
    required: true
  sdk-version-file:
    description: File that holds the exact SDK version (e.g. 9.3.0).
    required: true
  font-devices:
    description: Space-separated devices to also download simulator fonts for (needed for unit tests).
    required: false
    default: ''
  agreement-hash:
    description: Hash of the Connect IQ SDK license agreement that the maintainer has read and accepted.
    required: true
  garmin-username:
    description: Garmin developer account user name. Only used on a cache miss.
    required: true
  garmin-password:
    description: Garmin developer account password. Only used on a cache miss.
    required: true

outputs:
  sdk-bin:
    description: The SDK bin directory (also added to PATH).
    value: ${{ steps.path.outputs.sdk_bin }}

runs:
  using: composite
  steps:
    - name: Install connect-iq-sdk-manager CLI
      shell: bash
      env:
        # Pinned release and SHA-256 (taken from the release's checksums.txt, 2026-11-21).
        CLI_VERSION: '0.8.4'
        CLI_SHA256: '5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b'
      run: |
        set -euo pipefail
        archive="connect-iq-sdk-manager-cli_${CLI_VERSION}_Linux_x86_64.tar.gz"
        work="$RUNNER_TEMP/ciq-cli"
        mkdir -p "$work"
        curl -sSfL -o "$work/$archive" \
          "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${CLI_VERSION}/${archive}"
        echo "${CLI_SHA256}  $work/$archive" | sha256sum --check --strict
        tar -xzf "$work/$archive" -C "$work" connect-iq-sdk-manager
        echo "$work" >> "$GITHUB_PATH"

    - name: Compute cache key
      id: key
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        SDK_VERSION_FILE: ${{ inputs.sdk-version-file }}
        FONT_DEVICES: ${{ inputs.font-devices }}
      run: |
        set -euo pipefail
        sdk_version="$(tr -d '[:space:]' < "$SDK_VERSION_FILE")"
        if ! [[ "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=$SDK_VERSION_FILE::'$sdk_version' is not an exact SDK version (x.y.z)."
          exit 1
        fi
        products_hash="$(grep -o 'iq:product id="[^"]*"' "$MANIFEST" | sort | sha256sum | cut -c1-16)"
        fonts_hash="$(echo "$FONT_DEVICES" | sha256sum | cut -c1-8)"
        echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
        echo "key=ciq-${RUNNER_OS}-sdk${sdk_version}-p${products_hash}-f${fonts_hash}" >> "$GITHUB_OUTPUT"

    - name: Restore SDK and device files
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.Garmin/ConnectIQ
          !~/.Garmin/ConnectIQ/token.json
        key: ${{ steps.key.outputs.key }}

    - name: Download SDK and device files
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GARMIN_USERNAME: ${{ inputs.garmin-username }}
        GARMIN_PASSWORD: ${{ inputs.garmin-password }}
        AGREEMENT_HASH: ${{ inputs.agreement-hash }}
        MANIFEST: ${{ inputs.manifest }}
        SDK_VERSION: ${{ steps.key.outputs.sdk_version }}
        FONT_DEVICES: ${{ inputs.font-devices }}
      run: |
        set -euo pipefail
        # Remove the token whatever happens below, so it never reaches the cache or a later step.
        trap 'rm -f "$HOME/.Garmin/ConnectIQ/token.json"' EXIT
        if [ -z "$AGREEMENT_HASH" ] || [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
          echo "::error::CIQ_AGREEMENT_HASH (variable) and GARMIN_USERNAME / GARMIN_PASSWORD (secrets) are required on a cache miss. See docs/CI-CD.md."
          exit 1
        fi
        connect-iq-sdk-manager agreement accept --agreement-hash="$AGREEMENT_HASH"
        connect-iq-sdk-manager login
        connect-iq-sdk-manager sdk set "$SDK_VERSION"
        connect-iq-sdk-manager device download --manifest="$MANIFEST"
        for device in $FONT_DEVICES; do
          connect-iq-sdk-manager device download --device="$device" --include-fonts
        done

    - name: Save SDK and device files
      # Saved here, before any repository or pull-request code runs, so a run cannot poison the cache.
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.Garmin/ConnectIQ
          !~/.Garmin/ConnectIQ/token.json
        key: ${{ steps.key.outputs.key }}

    - name: Put the SDK on PATH
      id: path
      shell: bash
      run: |
        set -euo pipefail
        rm -f "$HOME/.Garmin/ConnectIQ/token.json"
        sdk_bin="$(connect-iq-sdk-manager sdk current-path --bin)"
        test -x "$sdk_bin/monkeyc"
        echo "$sdk_bin" >> "$GITHUB_PATH"
        echo "sdk_bin=$sdk_bin" >> "$GITHUB_OUTPUT"
