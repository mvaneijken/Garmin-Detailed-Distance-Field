trigger:
- master

variables:
- name: name
  value: 'Garmin-Detailed-Distance-Field' 
- name: azureSubscription
  value: 'Microsoft Partner Network'
- name: keyVaultName
  value: 'connect-iq'
- name: secretsFilter
  value: '*'

pool:
  vmImage: 'Ubuntu-16.04'

steps:
- script: |
    sudo apt-get update -y;
    sudo apt-get install -qqy openjdk-8-jdk;
    sudo apt-get install -qqy unzip wget git ssh tar gzip ca-certificates;
    sudo apt-get clean;
    sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*;
  displayName: 'Install Dependencies'

- script: |
    cd /opt;
    #Source = https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json
    wget -q https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-7.4.3-2024-12-11-90ec25e45.zip -O ciq.zip;
    unzip ciq.zip -d ciq;
    rm -f ciq.zip;
  displayName: 'Install ConnectIQ SDK'

- task: AzureKeyVault@1
  inputs:
    azureSubscription: $(azureSubscription)
    keyVaultName: $(keyVaultName)
    secretsFilter: $(secretsFilter)
  displayName: 'Get Developer Key'

- script: |
    echo '$(connect-iq-dev-key)' | base64 --decode > /opt/connectiq-developer-key.der;
  displayName: 'Write Developer Key'

- script: |
    java -Dfile.encoding=UTF-8 -Dapple.awt.UIElement=true -jar /opt/ciq/bin/monkeybrains.jar -o $(Build.ArtifactStagingDirectory)/MY_APP.iq -e -w -y /opt/connectiq-developer-key.der -r -f $(Build.SourcesDirectory)/monkey.jungle;
  displayName: 'Build & Package iq file'

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)/$(name).iq'
    artifactName: 'iq'
  displayName: 'Publish Artifact'